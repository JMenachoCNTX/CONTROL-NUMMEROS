<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONTROL · NUMMEROS</title>
<meta name="description" content="Panel CONTROL de NUMMEROS by CONTAX: pagos, facturas y trámites de los repartidores del Portal CONTAX.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F8F4">
<link rel="icon" href="marca/iconos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="marca/iconos/icono-app-principal-32.png">
<link rel="apple-touch-icon" href="marca/iconos/icono-app-principal-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="marca/fuentes/Akshar-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="marca/fuentes/Questrial-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ══════════════════════════════════════════════════════════
   CONTROL · NUMMEROS — diseño según el Manual de marca NUMMEROS v1.1
   Seis verdes, Akshar (títulos y cifras) + Century Gothic/Questrial (texto).
   Menú lateral menta con el logotipo principal; verde noche solo en modo oscuro.
   ══════════════════════════════════════════════════════════ */
@font-face{font-family:Akshar;font-weight:600;font-display:swap;src:url(marca/fuentes/Akshar-600.woff2) format('woff2')}
@font-face{font-family:Akshar;font-weight:700;font-display:swap;src:url(marca/fuentes/Akshar-700.woff2) format('woff2')}
@font-face{font-family:Questrial;font-weight:400;font-display:swap;src:url(marca/fuentes/Questrial-400.woff2) format('woff2')}
:root{
  --verde-950:#051F20;--verde-900:#0B2B26;--verde-800:#163832;--verde-700:#235347;--verde-300:#8EB69B;--verde-100:#DAF1DE;
  --fondo:#F4FAF5;--superficie:#FFFFFF;--campo:#EEF7F0;--borde:#DAF1DE;--borde-control:#6F9A7D;
  --texto:#163832;--suave:#557363;--acento:#235347;--sobre-acento:#FFFFFF;
  --menu-fondo:#0B2B26;--menu-texto:#CFE3D7;--menu-activo:#235347;--menu-sobre-activo:#FFFFFF;--menu-sec:#6F9488;
  --ok:#235347;--ok-bg:#DAF1DE;--aviso:#93370D;--aviso-bg:#FFFAEB;--aviso-linea:#F5C26B;--error:#B42318;--error-bg:#FEF3F2;--error-linea:#FDA29B;
  --azul-contax:#1B2A4A;--colab-oscuro:#031828;--colab-claro:#E4EDEA;
  --sombra:0 1px 2px rgba(5,31,32,.08);--sombra-alta:0 18px 48px rgba(5,31,32,.16);
  --r-sm:6px;--r-md:10px;--r-lg:16px;
  --display:Akshar,"Arial Narrow",sans-serif;--cuerpo:"Century Gothic",Questrial,"Avenir Next",sans-serif;
  color-scheme:light;
}
:root[data-theme="oscuro"]{
  --fondo:#051F20;--superficie:#0B2B26;--campo:#163832;--borde:#235347;--borde-control:#8EB69B;
  --texto:#DAF1DE;--suave:#8EB69B;--acento:#8EB69B;--sobre-acento:#051F20;
  --menu-fondo:#0B2B26;--menu-texto:#CFE3D7;--menu-activo:#235347;--menu-sobre-activo:#FFFFFF;--menu-sec:#6F9488;
  --ok:#8EB69B;--ok-bg:#163832;--aviso:#FDB022;--aviso-bg:#2A2410;--aviso-linea:#7A5A12;--error:#F97066;--error-bg:#3A1714;--error-linea:#7A2A22;
  --sombra:none;--sombra-alta:0 18px 48px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:15px/1.55 var(--cuerpo);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;color:var(--texto);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acento)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.num,.monto{font-variant-numeric:tabular-nums}
.monto{text-align:right;white-space:nowrap}
.muted{color:var(--suave)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}

/* ── Botones, campos, chips ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acento);color:var(--sobre-acento);border:1px solid var(--acento);border-radius:var(--r-md);padding:9px 16px;font:600 15px var(--display);letter-spacing:.03em;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.sec{background:var(--superficie);color:var(--texto);border-color:var(--borde)}
.btn.sec:hover{background:var(--campo)}
.btn.peligro{background:var(--error);border-color:var(--error);color:#fff}
.btn.chico{min-height:32px;padding:4px 10px;font-size:13px;border-radius:var(--r-sm)}
.btn.ancho{width:100%}
.btn .ic{width:18px;height:18px}
.icono-btn{border:1px solid var(--borde);background:var(--superficie);border-radius:var(--r-sm);width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--texto)}
.icono-btn:hover{background:var(--campo)}
.campo,.fm input,.fm select,.fm textarea{width:100%;background:var(--campo);border:1px solid var(--borde-control);border-radius:var(--r-sm);padding:9px 12px;color:var(--texto)}
.fm textarea{resize:vertical;min-height:80px}
.fm label{display:block;font:600 13px var(--display);letter-spacing:.03em;margin:0 0 5px}
.fm .fila{margin-bottom:14px}
.fm small{display:block;color:var(--suave);font-size:12px;margin-top:4px}
.fm .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 14px}
.interruptor{display:flex;align-items:center;gap:10px;cursor:pointer;font:600 14px var(--display)}
.interruptor input{width:18px;height:18px;accent-color:var(--acento)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font:600 12px var(--display);letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--borde)}
.chip.pend{background:var(--aviso-bg);color:var(--aviso);border-color:var(--aviso-linea)}
.chip.mal{background:var(--error-bg);color:var(--error);border-color:var(--error-linea)}
.chip.neutro{background:var(--campo);color:var(--suave);border-color:var(--borde)}
.chip.contax{background:#E6ECF5;color:var(--azul-contax);border-color:#C6D2E6}
:root[data-theme="oscuro"] .chip.contax{background:#16233A;color:#B8C7E3;border-color:#2B3D5E}

/* ── Inicio de sesión: igual al Panel (formulario + foto de los clásicos con degradado verde) ── */
.login{min-height:100vh;display:flex;background:var(--fondo)}
.login-panel{flex:0 0 44%;max-width:540px;display:flex;flex-direction:column;justify-content:center;padding:48px clamp(28px,6vw,80px);background:var(--superficie)}
.login-caja{width:100%}
.login-logo{width:210px;height:auto;display:block;margin-bottom:26px}
.login h2{font:700 30px/1.1 var(--display);margin:0 0 6px}
.login .texto{color:var(--suave);font-size:14px;margin:0 0 24px}
.login .fm .fila{margin-bottom:16px}
.login .fm input{padding:13px 14px}
.login #btnEntrar{min-height:46px}
.login-err{min-height:20px;margin-top:10px;color:var(--error);font-size:13px}
.login .ver{display:inline-block;margin-top:18px}
.login-foto{flex:1;position:relative;overflow:hidden;background-size:cover;background-position:center}
.login-foto .marca-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.12}
.login-foto .marca-n img{width:34%;max-width:300px}
.login-foto .tag{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:#EAF3EE;font-size:14px;letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.4);padding:0 16px}
@media (max-width:860px){.login-foto{display:none}.login-panel{flex:1;max-width:none;padding:40px 24px}}

.insignia{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);color:var(--verde-800);border-radius:999px;padding:7px 16px 7px 8px;font:700 17px var(--display);letter-spacing:.04em;box-shadow:0 6px 18px rgba(5,31,32,.18)}
.insignia i{width:26px;height:26px;border-radius:50%;background:var(--verde-700);display:grid;place-items:center}
.insignia i img{width:10px;height:auto}
.insignia span{font:400 12px var(--cuerpo);color:#557363;letter-spacing:0}

/* ── Estructura del panel ── */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
/* Menú oscuro en claro y oscuro, igual que el Panel NUMMEROS (misma línea visual en todos los sistemas) */
.menu{background:linear-gradient(180deg,#0B2B26 0%,#051F20 100%);color:var(--menu-texto);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 14px 16px;scrollbar-width:thin}
.menu-logo{display:block;padding:4px 8px 20px}
.menu-logo img{height:28px;width:auto;display:block}
.menu-logo small{display:block;font:600 12px var(--display);letter-spacing:.2em;color:#8EB69B;margin-top:6px}
.ctrl-ver{letter-spacing:.04em;font-weight:500;opacity:.85;margin-left:4px}
.menu-sec{display:block;font:600 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--menu-sec);margin:16px 10px 6px}
.menu-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--menu-texto);padding:8px 10px;border-radius:var(--r-md);cursor:pointer;font-size:14.5px;text-align:left}
.menu-link{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .14s ease,box-shadow .14s ease,color .14s ease}
.menu-link:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateX(4px) translateY(-2px) scale(1.015);box-shadow:0 6px 16px rgba(0,0,0,.33),0 1px 0 rgba(255,255,255,.08) inset}
.menu-link.activo{background:var(--menu-activo);color:var(--menu-sobre-activo);font-weight:600;box-shadow:inset 3px 0 0 #8EB69B}
.menu-link .cuenta{margin-left:auto;font:600 12px var(--display);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:0 8px;min-width:22px;text-align:center}
.menu-link.activo .cuenta{background:rgba(255,255,255,.25);color:inherit}
.menu-pie{margin-top:auto;padding:16px 8px 0;font-size:12px;color:#8EB69B}
.menu-pie img{height:30px;width:auto;display:block;margin-bottom:6px}
.inf-ficha{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.inf-ini{width:64px;height:64px;border-radius:50%;background:var(--verde-700);color:#fff;display:grid;place-items:center;font:700 24px var(--display);flex:none;box-shadow:0 6px 0 var(--verde-900),0 12px 22px rgba(5,31,32,.25)}
.inf-nom{flex:1;min-width:220px}.inf-nom h2{font:700 26px/1.1 var(--display);margin:0 0 2px}
.inf-acc{margin-left:auto}
.lista-res{display:grid;gap:6px;margin-top:12px;max-height:420px;overflow:auto}
.fila-res{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--borde);background:var(--superficie);color:var(--texto);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;text-align:left;font-size:14px}
.fila-res:hover{border-color:var(--acento);background:rgba(35,83,71,.06)}
.tabla-ancha{overflow-x:auto}.tabla-ancha table{min-width:1500px}
/* Menú plegable: solo íconos; al pasar el cursor, el ícono «sobresale» */
.menu{transition:width .18s}
.menu-plegar{align-self:flex-end;border:0;background:transparent;color:#8EB69B;width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;margin:-10px -4px 0 0}
.menu-plegar:hover{background:rgba(255,255,255,.10);color:#fff}
.menu-iso{display:none!important}
@media (min-width:981px){
.app.menu-mini{grid-template-columns:76px minmax(0,1fr)}
.app.menu-mini .contenido{max-width:none}
.app.menu-mini .menu{padding:16px 10px;overflow-x:visible;align-items:center}
.app.menu-mini .menu-plegar{align-self:center;margin:0 0 8px}
.app.menu-mini .menu-logo{padding:2px 0 14px}
.app.menu-mini .menu-logo img:first-child,.app.menu-mini .menu-logo small,.app.menu-mini .menu-sec,.app.menu-mini .menu-pie,.app.menu-mini .menu-link span{display:none}
.app.menu-mini .menu-iso{display:block!important;height:30px;width:auto}
.app.menu-mini .menu-sec+.menu-link,.app.menu-mini .menu-link{width:48px;height:44px;justify-content:center;padding:0;position:relative;transition:transform .15s,box-shadow .15s,background .15s;margin:2px 0}
.app.menu-mini .menu-link:hover{transform:scale(1.18) translateX(3px);background:#163832;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:2}
.app.menu-mini .menu-link .ic{width:22px;height:22px}
.app.menu-mini .menu-link .cuenta{display:block;position:absolute;top:2px;right:0;min-width:16px;font-size:10px;padding:0 4px}
.app.menu-mini.menu-ver{grid-template-columns:256px minmax(0,1fr)}
.app.menu-mini.menu-ver .cuerpo{grid-column:2}
.app.menu-mini.menu-ver .menu{position:fixed;inset:0 auto 0 0;width:256px;z-index:60;box-shadow:var(--sombra-alta);align-items:stretch;padding:22px 14px 16px}
.app.menu-mini.menu-ver .menu-plegar{align-self:flex-end;margin:-10px -4px 0 0}
.app.menu-mini.menu-ver .menu-logo img:first-child,.app.menu-mini.menu-ver .menu-logo small,.app.menu-mini.menu-ver .menu-sec,.app.menu-mini.menu-ver .menu-pie,.app.menu-mini.menu-ver .menu-link span{display:block}
.app.menu-mini.menu-ver .menu-link span.cuenta{display:block}
.app.menu-mini.menu-ver .menu-iso{display:none!important}
.app.menu-mini.menu-ver .menu-link{width:100%;height:auto;justify-content:flex-start;padding:8px 10px}
.app.menu-mini.menu-ver .menu-link:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.10)}
.app.menu-mini.menu-ver .menu-link .cuenta{position:static;margin-left:auto}
}
.cab{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--fondo) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde)}
.cab .hamb{display:none}
.cab-estado{font-size:13px;color:var(--suave);display:flex;align-items:center;gap:8px;min-width:0}
.cab-estado b{font:600 13px var(--display);color:var(--texto)}
.cab-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.presencia{display:flex;align-items:center}
.pr-lista{display:flex;align-items:center}
.pr-bur{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 12px var(--display);border:2px solid var(--fondo,#fff);margin-left:-6px;flex:none;cursor:default}
.pr-lista .pr-bur:first-child{margin-left:0}
.pr-aqui{box-shadow:0 0 0 2px var(--verde-500,#8EB69B)}
.pr-mas{background:var(--borde);color:var(--texto)}
.pr-campana{position:relative}
.pr-num{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#C0392B;color:#fff;font:700 10px/17px var(--display);text-align:center}
.pr-fila{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--borde)}
.pr-fila:last-child{border-bottom:0}
.pr-fila .pr-bur{margin-left:0}
.pr-toast{bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 32px))}
@media (max-width:640px){.presencia{display:none}}
.usuario{display:flex;align-items:center;gap:8px;border:1px solid var(--borde);background:var(--superficie);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;max-width:280px}
.usuario img,.usuario .ini{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover}
.usuario .ini{background:var(--verde-700);color:#fff;display:grid;place-items:center;font:700 13px var(--display)}
.usuario span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usuario em{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--acento);font-style:normal}
.contenido{padding:24px clamp(16px,3vw,32px) 64px;max-width:1360px;width:100%}
.pg-tit{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pg-tit h1{font-size:clamp(30px,3.4vw,40px);font-weight:700}
.pg-tit p{margin:6px 0 0;color:var(--suave);max-width:70ch}
.pg-acc{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sombra);min-width:0}
.card+.card{margin-top:16px}
.h2{display:flex;align-items:center;gap:10px;justify-content:space-between;font:600 20px/1.2 var(--display);margin:0 0 14px;flex-wrap:wrap}
.h2 small{font:400 13px var(--cuerpo);color:var(--suave)}
.rejilla{display:grid;gap:16px}
.r2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.r3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.r4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.mb{margin-bottom:16px}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .menu{position:fixed;inset:0 auto 0 0;width:280px;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--sombra-alta)}
  .app.menu-abierto .menu{transform:none}
  .app.menu-abierto:after{content:"";position:fixed;inset:0;background:rgba(5,31,32,.4);z-index:50}
  .cab .hamb{display:inline-grid}
  .menu-plegar{display:none}
  .cab-estado{display:none}
  .usuario span{display:none}
}

/* ── KPIs y portada ── */
.kpi{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sombra);text-align:left;cursor:default;min-width:0;display:block;width:100%;color:var(--texto)}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--verde-300)}
.kpi.activo{border-color:var(--acento);box-shadow:0 0 0 2px var(--acento)}
.kpi small{display:block;font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.kpi b{display:block;font:700 clamp(24px,2.3vw,34px)/1.05 var(--display);margin:8px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:13px;color:var(--suave)}
.ciu-card{border:1px solid var(--borde);border-radius:var(--r-lg);padding:16px 18px;min-width:0}
.ciu-card.total{background:var(--acento);border-color:transparent;color:var(--sobre-acento)}
.ciu-card small{display:block;font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.ciu-card.total small,.ciu-card.total .ciu-fila span{color:var(--sobre-acento);opacity:.8}
.ciu-card>b{display:block;font:700 clamp(22px,2vw,30px)/1.1 var(--display);margin:8px 0 10px;white-space:nowrap}
.ciu-fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--borde);font-size:14px}
.ciu-card.total .ciu-fila{border-color:color-mix(in srgb,var(--sobre-acento) 25%,transparent)}
.ciu-fila span{color:var(--suave)}
.ciu-fila.ok b{color:var(--ok)}
.ciu-card.total .ciu-fila b{color:var(--sobre-acento)}
.kpi.alerta b{color:var(--aviso)}
.portada{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:250px;display:flex;align-items:flex-end;margin-bottom:16px;background:var(--colab-claro)}
.portada img.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.portada:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,24,40,.82) 0%,rgba(3,24,40,.45) 46%,rgba(3,24,40,0) 72%)}
.portada .txt{position:relative;z-index:1;padding:26px 28px;color:#fff;max-width:560px}
.portada h2{color:#fff;font:700 clamp(28px,3.4vw,40px)/1 var(--display)}
.portada p{margin:10px 0 16px;color:#DAF1DE;font-size:15px}
.portada .insignia{position:absolute;z-index:1;right:18px;bottom:18px}
.portada .acc{display:flex;gap:8px;flex-wrap:wrap}
.portada .btn.sec{background:rgba(255,255,255,.95);color:var(--verde-800);border-color:transparent}
@media (max-width:700px){.portada .insignia{display:none}.portada:after{background:linear-gradient(180deg,rgba(3,24,40,.25),rgba(3,24,40,.85))}}
.corte{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.corte .reloj{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.relieve{width:84px;height:84px;object-fit:contain;flex:none;border-radius:50%}
.lista-tareas{list-style:none;margin:0;padding:0}
.lista-tareas li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--borde)}
.lista-tareas li:last-child{border-bottom:0}
.lista-tareas li .ic{color:var(--acento)}
.lista-tareas li span{flex:1}
.lista-tareas li b{font:600 18px var(--display);font-variant-numeric:tabular-nums}

/* ── Tablas ── */
.herr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.buscar{position:relative;flex:1;min-width:220px;max-width:420px}
.buscar .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--suave)}
.buscar input{width:100%;background:var(--campo);border:1px solid var(--borde-control);border-radius:var(--r-md);padding:9px 12px 9px 38px}
.herr select{background:var(--campo);border:1px solid var(--borde-control);border-radius:var(--r-md);padding:9px 10px;max-width:220px}
.pestanas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pestanas button{border:1px solid var(--borde);background:var(--superficie);color:var(--texto);border-radius:999px;padding:7px 14px;font:600 14px var(--display);letter-spacing:.02em;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.pestanas button[aria-selected="true"]{background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.pestanas button em{font-style:normal;font-size:12px;opacity:.8}
.tabla{overflow-x:auto;border:1px solid var(--borde);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--borde);vertical-align:middle}
th{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--suave);background:var(--campo);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover td{background:var(--campo)}
tfoot td{font:600 15px var(--display);background:var(--campo);border-top:1px solid var(--borde)}
td.monto,th.monto{text-align:right}
td .sub{display:block;font-size:12px;color:var(--suave)}
.paginador{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--suave);flex-wrap:wrap}
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 16px;color:var(--suave)}
.vacio img{width:150px;height:auto;margin-bottom:6px;border-radius:12px}
.vacio b{font:600 18px var(--display);color:var(--texto)}

/* ── Panel lateral (detalle) y ventanas ── */
.velo{position:fixed;inset:0;background:rgba(5,31,32,.45);z-index:80;display:flex;justify-content:flex-end}
.cajon{background:var(--fondo);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;animation:entrar .2s ease-out}
@keyframes entrar{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.cajon.completa{width:100%}
.cn-caja{max-height:calc(100vh - 150px);overflow:auto}
table.cn{min-width:2360px;font-size:13px}
.cn th[data-ord]{cursor:pointer;top:33px}
.cn th[data-ord]:hover{color:var(--texto)}
.cn td{vertical-align:top}
.cn .cn-ini{border-left:2px solid var(--borde-control)}
.cn-grupos th{text-align:center;height:33px;font-size:13px;color:var(--texto)}
.cn-grupos .cn-e{background:var(--azul-tinte,#E3E9F4);color:#1B2A4A}
.cn-grupos .cn-c{background:var(--ok-bg);color:var(--ok);border-left:2px solid var(--borde-control)}
.cn-grupos .cn-r{background:var(--aviso-bg);color:var(--aviso);border-left:2px solid var(--borde-control)}
.cajon-cab{position:sticky;top:0;z-index:2;background:var(--superficie);border-bottom:1px solid var(--borde);padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.cajon-cab h2{font-size:24px}
.cajon-cab p{margin:4px 0 0;color:var(--suave);font-size:13px}
.cajon-cab .cerrar{margin-left:auto}
.cajon-cuerpo{padding:18px 20px 40px}
.velo.centro{justify-content:center;align-items:center;padding:16px}
.ventana{background:var(--superficie);border-radius:var(--r-lg);width:min(620px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:var(--sombra-alta);animation:entrar .18s ease-out}
.ventana-cab{position:relative;overflow:hidden;background:var(--verde-800);color:#fff;padding:20px 22px}
.ventana-cab:before{content:"";position:absolute;inset:0;background:url(marca/graficos/pat-patron-n.png) 0 0/140px auto;opacity:.12}
.ventana-cab h3{position:relative;color:#fff;font-size:24px}
.ventana-cab p{position:relative;margin:6px 0 0;color:#DAF1DE;font-size:13px}
.ventana-cuerpo{padding:20px 22px}
.ventana-pie{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 20px;flex-wrap:wrap}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-bottom:16px}
.dato{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.dato small{display:block;font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.dato b{display:block;font:600 16px var(--display);margin-top:2px;word-break:break-word}
.secreto{display:flex;align-items:center;gap:6px}
.secreto code{font:600 14px var(--display);background:var(--campo);border:1px solid var(--borde);border-radius:var(--r-sm);padding:3px 8px;user-select:all}
.pdf{width:100%;height:62vh;border:1px solid var(--borde);border-radius:var(--r-md);background:var(--campo)}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comparar .dato.mal{border-color:var(--error-linea);background:var(--error-bg)}
.comparar .dato.bien{border-color:var(--verde-300)}
.sello{display:flex;align-items:center;gap:14px;background:var(--ok-bg);border:1px solid var(--borde);border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px}
.sello img{width:120px;height:auto;border-radius:10px}
.nota-interna{background:var(--aviso-bg);border:1px solid var(--aviso-linea);border-radius:var(--r-md);padding:10px 12px;font-size:14px;color:var(--aviso)}
.aviso-caja{display:flex;gap:12px;align-items:flex-start;background:var(--campo);border:1px solid var(--borde);border-left:4px solid var(--acento);border-radius:var(--r-md);padding:12px 14px;margin-bottom:16px;font-size:14px}
.aviso-caja.alerta{background:var(--aviso-bg);border-color:var(--aviso-linea);border-left-color:var(--aviso);color:var(--aviso)}
.aviso-caja.error{background:var(--error-bg);border-color:var(--error-linea);border-left-color:var(--error);color:var(--error)}
.aviso-caja .ic{color:inherit;margin-top:1px}
.aviso-caja b{display:block;font:600 15px var(--display);margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--verde-800);color:#fff;padding:11px 18px;border-radius:var(--r-md);font:600 14px var(--display);letter-spacing:.02em;z-index:200;box-shadow:var(--sombra-alta);max-width:calc(100% - 32px)}
.grafico{position:relative;height:260px}
/* Gráficos 3D: «ampliar» y efecto al pasar el cursor */
.con-graf{transition:transform .2s ease,box-shadow .2s ease}
.con-graf:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.con-graf .grafico{cursor:zoom-in}
.ventana.ventana-graf{width:min(1100px,100%);animation:crecer .38s cubic-bezier(.2,.9,.3,1.15)}
@keyframes crecer{from{transform:scale(.72) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grafico.grande{height:min(62vh,560px);cursor:default}
.graf-rejilla>.card{margin-top:0}
.graf-rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.graf-rejilla{grid-template-columns:1fr}}
/* Nombre de la opción al pasar el cursor sobre el menú plegado */
.menu-tip{position:fixed;z-index:90;transform:translate(-6px,-50%);opacity:0;pointer-events:none;background:var(--verde-800);color:#fff;font:600 13.5px var(--display);letter-spacing:.03em;padding:6px 12px;border-radius:8px;box-shadow:var(--sombra-alta);white-space:nowrap;transition:opacity .12s,transform .12s}
.menu-tip:before{content:"";position:absolute;left:-5px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:0;border-right-color:var(--verde-800)}
.menu-tip.ver{opacity:1;transform:translate(0,-50%)}
/* Subpestañas */
.subpestanas{display:flex;gap:4px;border-bottom:2px solid var(--borde);margin:0 0 16px;overflow-x:auto}
.subpestanas button{border:0;background:transparent;color:var(--suave);font:600 15px var(--display);letter-spacing:.03em;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.subpestanas button[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--acento)}
.subpestanas button em{font-style:normal;font-size:12px;background:var(--campo);border-radius:999px;padding:0 8px}
.fila-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.miniatura{width:96px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--borde);background:var(--campo)}
.pasos-img{width:100%;height:auto;border-radius:var(--r-md);border:1px solid var(--borde);display:block}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.galeria figure{margin:0;position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--borde)}
.galeria img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.galeria figcaption{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.94);color:var(--verde-800);border-radius:999px;padding:3px 10px;font:600 12px var(--display);letter-spacing:.03em}
.elementos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.elementos img{width:100%;height:auto;border-radius:12px;border:1px solid var(--borde);display:block}

/* ══════ Pantallas de espera NUMMEROS (las seis del manual) ══════ */
.nm-carga{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:40px 16px}
.nm-carga .nm-n{width:56px;height:auto;display:block}
.nm-carga .nm-n-base{fill:var(--borde)}
.nm-carga .nm-n-fill{fill:var(--acento)}
.nm-ola{animation:nmLlenar 2s cubic-bezier(.62,0,.38,1) infinite}
@keyframes nmLlenar{0%{transform:translateY(728px)}52%{transform:translateY(0)}64%{transform:translateY(0)}100%{transform:translateY(-728px)}}
.nm-titulo{font:600 20px/1.2 var(--display);margin:0;color:var(--texto)}
.nm-paso{font-size:14px;margin:0;color:var(--suave)}
.nm-cifras{display:flex;flex-direction:column;align-items:center;gap:10px}
.nm-monto{display:flex;align-items:flex-end;gap:2px;font:700 44px/52px var(--display);color:var(--texto);font-variant-numeric:tabular-nums}
.nm-monto .nm-bs{font-size:26px;line-height:52px;margin-right:6px;color:var(--acento)}
.nm-monto .nm-sep{line-height:52px}
.nm-rod{display:block;height:52px;overflow:hidden;width:.6em}
.nm-rod span{display:block;text-align:center}
.nm-tira{animation:nmRodar 1s linear infinite}
.nm-v1 .nm-tira{animation-duration:.62s}.nm-v2 .nm-tira{animation-duration:.78s}.nm-v3 .nm-tira{animation-duration:.95s}.nm-v4 .nm-tira{animation-duration:1.18s}
@keyframes nmRodar{from{transform:translateY(0)}to{transform:translateY(-520px)}}
.nm-barra-bloque{width:100%;display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.nm-barra-fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.nm-barra-fila b{font:600 16px var(--display)}
.nm-barra-fila span{font-size:13px;color:var(--suave)}
.nm-barra{height:8px;border-radius:999px;overflow:hidden;position:relative;background:var(--borde)}
.nm-barra::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,var(--acento) 0 9px,var(--borde) 9px 18px);background-size:36px 100%;animation:nmCorrer .62s linear infinite}
@keyframes nmCorrer{from{background-position:0 0}to{background-position:36px 0}}
.nm-mini{display:inline-flex;align-items:center;gap:10px}
.nm-mini>span:last-child{font-size:14.5px;color:var(--suave)}
.nm-anillo{position:relative;width:34px;height:34px;flex:none;display:inline-block}
.nm-anillo-chico{width:18px;height:18px}
.nm-anillo svg.nm-giro{position:absolute;inset:0;width:100%;height:100%;animation:nmGirar .9s linear infinite}
.nm-anillo .nm-pista{fill:none;stroke:var(--borde);stroke-width:3}
.nm-anillo .nm-arco{fill:none;stroke:var(--acento);stroke-width:3;stroke-linecap:round;stroke-dasharray:28 72}
.nm-anillo .nm-n-centro{position:absolute;inset:0;display:grid;place-items:center}
.nm-anillo .nm-n-centro svg{width:11px;height:auto;display:block}
.nm-anillo .nm-n-centro path{fill:var(--acento);animation:nmLatir 1.8s ease-in-out infinite}
@keyframes nmGirar{to{transform:rotate(360deg)}}
@keyframes nmLatir{0%,100%{opacity:1}50%{opacity:.35}}
.btn .nm-pista{stroke:rgba(255,255,255,.35)}
.btn .nm-arco{stroke:currentColor}
.nm-esqueleto{background:var(--superficie);border:1px solid var(--borde);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.nm-linea{height:13px;border-radius:7px;position:relative;overflow:hidden;background:var(--borde)}
.nm-linea.alta{height:30px;width:52%}.nm-linea.corta{width:38%}.nm-linea.media{width:72%}
.nm-fila-esq{display:flex;gap:12px;align-items:center}
.nm-fila-esq .nm-linea{flex:1}
.nm-linea::after{content:"";position:absolute;inset:0;opacity:.75;background:linear-gradient(100deg,transparent 0%,var(--superficie) 45%,transparent 90%);transform:translateX(-100%);animation:nmBrillo 1.35s ease-in-out infinite}
@keyframes nmBrillo{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.nm-overlay{position:fixed;inset:0;z-index:300;background:var(--fondo);display:grid;place-items:center}
.nm-pantalla{position:relative;overflow:hidden;width:100%;height:100%;display:grid;place-items:center;padding:40px 24px}
.nm-marca-agua{position:absolute;right:-60px;bottom:-110px;width:300px;height:auto;opacity:.5;pointer-events:none}
.nm-marca-agua path{fill:var(--borde)}
.nm-panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:340px;width:100%}
.nm-retrato{position:relative;width:132px;height:132px;border-radius:50%;overflow:hidden;flex:none;background:var(--borde);box-shadow:0 0 0 1px var(--borde),0 10px 30px rgba(5,31,32,.12)}
.nm-retrato img{width:100%;height:100%;object-fit:cover;display:block;animation:nmAparecer .6s ease-out both}
.nm-retrato::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(70% 60% at 30% 70%,rgba(142,182,155,.55),transparent 65%);animation:nmLuz 2.6s ease-in-out infinite}
@keyframes nmLuz{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes nmAparecer{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.nm-logo-marca{height:26px;width:auto;display:block}
.nm-pantalla .nm-titulo{font-size:24px}
.nm-pantalla .nm-barra{width:190px}
.nm-retrato-nombre{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--acento)}
@media (prefers-reduced-motion:reduce){
  .nm-ola,.nm-tira,.nm-barra::before,.nm-anillo svg.nm-giro,.nm-anillo .nm-n-centro path,.nm-linea::after,.nm-retrato::after,.nm-retrato img,.login-foto img.foto,.cajon,.ventana{animation:none!important}
  .nm-linea::after{opacity:0}
}
/* ══════════════════════════════════════════════════════════
   2.4.74 · Misma línea visual que el Panel NUMMEROS
   Colores, cabecera blanca con el título, menú con usuario abajo, tablas,
   botones y ventanas como en el Panel. Títulos y cifras siguen en Akshar
   y el texto en Century Gothic/Questrial (Manual de marca NUMMEROS).
   ══════════════════════════════════════════════════════════ */
:root{--fondo:#F3F8F4;--superficie:#FFFFFF;--campo:#EEF4F0;--borde:#E2ECE5;--borde-control:#D3E2D8;--texto:#0E2A24;--suave:#5E7A70;--sombra:0 1px 2px rgba(11,43,38,.03);--r-lg:14px}
:root[data-theme="oscuro"]{--fondo:#07201C;--superficie:#0E2A24;--campo:#143A32;--borde:#1E4A40;--borde-control:#2A5E50;--texto:#EAF3EE;--suave:#8FB0A6;--acento:#8EB69B;--sobre-acento:#06211D}
body{font-size:14px}
/* Botones */
.btn{font:600 14px var(--cuerpo);letter-spacing:0;padding:10px 16px}
.btn.sec{background:var(--campo);border-color:var(--borde)}
.btn.sec:hover{background:var(--campo);border-color:var(--acento);filter:none}
.btn.chico{font-size:12.5px}
.icono-btn{width:38px;height:38px;border-radius:var(--r-md);background:var(--campo);border-color:var(--borde)}
.icono-btn:hover{background:var(--campo);border-color:var(--acento)}
/* Campos */
.campo,.fm input,.fm select,.fm textarea,.buscar input,.herr select{background:var(--campo);border:1px solid var(--borde);border-radius:var(--r-md)}
.campo:focus,.fm input:focus,.fm select:focus,.fm textarea:focus,.buscar input:focus,.herr select:focus{outline:none;border-color:var(--acento)}
.fm label{font:600 12px var(--cuerpo);letter-spacing:.02em;color:var(--suave)}
.interruptor{font:600 14px var(--cuerpo)}
/* Etiquetas de estado */
.chip{font:700 11.5px var(--cuerpo);letter-spacing:0;padding:3px 10px}
.chip:before{display:none}
.chip.ok{background:var(--verde-100);border-color:transparent}
:root[data-theme="oscuro"] .chip.ok{background:#163832}
.chip.pend,.chip.mal,.chip.neutro,.chip.contax{border-color:transparent}
.chip.neutro{background:transparent;border-color:var(--borde)}
.ver{display:inline-block;font:800 11px var(--cuerpo);letter-spacing:.06em;color:var(--acento);border:1px solid var(--borde);border-radius:20px;padding:2px 9px;background:var(--campo);vertical-align:middle}
/* Menú lateral: logo con versión y usuario abajo (como el Panel) */
.menu{padding:0;width:auto}
.menu-logo{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:20px 20px 10px;text-decoration:none}
.menu-logo img{height:26px}
.menu-logo .ver{margin-left:auto;color:#8EB69B;background:rgba(142,182,155,.12);border-color:rgba(142,182,155,.35)}
.menu-logo small{flex-basis:100%;margin-top:2px;font:600 11px var(--cuerpo);letter-spacing:.2em}
.menu-links{flex:1;overflow-y:auto;padding:4px 12px 10px;scrollbar-width:thin}
.menu-sec{font:600 10.5px var(--cuerpo);letter-spacing:.12em;margin:15px 10px 6px}
.menu-link{font-size:13.5px;font-weight:500;padding:9px 11px;border-radius:9px;gap:11px}
.menu-link .ic{width:19px;height:19px}
.menu-link .cuenta{font:700 11px var(--cuerpo)}
.menu-plegar{display:none!important}
.menu-pie{margin:0;padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;font-size:12.5px;color:#CFE3D7}
.menu-pie .ava{width:36px;height:36px;border-radius:10px;background:#8EB69B;color:#06211D;display:grid;place-items:center;font:800 15px var(--cuerpo);flex:0 0 36px;object-fit:cover;margin:0}
.menu-pie .who{flex:1;min-width:0;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-pie .who em{display:block;font-style:normal;font-size:11px;color:#8EB69B}
.menu-pie button{background:rgba(255,255,255,.08);color:#CFE3D7;width:34px;height:34px;border:0;border-radius:10px;display:grid;place-items:center;flex:0 0 34px;cursor:pointer}
.menu-pie button:hover{background:rgba(255,255,255,.16);color:#fff}
.menu-pie button .ic{width:18px;height:18px}
@media (min-width:981px){
  .app.menu-mini{grid-template-columns:68px minmax(0,1fr)}
  .app.menu-mini .menu{padding:0}
  .app.menu-mini .menu-logo{justify-content:center;padding:20px 0 12px}
  .app.menu-mini .menu-logo .ver,.app.menu-mini .menu-pie .who,.app.menu-mini .menu-pie button{display:none}
  .app.menu-mini .menu-iso{height:26px}
  .app.menu-mini .menu-links{padding:4px 10px;overflow-x:visible;display:flex;flex-direction:column;align-items:center}
  .app.menu-mini .menu-pie{display:flex;justify-content:center;padding:12px 0}
}
/* Cabecera blanca con el título de la página */
.cab{background:var(--superficie);backdrop-filter:none;padding:12px 28px;gap:14px;z-index:20}
.cab .hamb{display:none!important}
.cab-tit{font:700 22px/1.1 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cab-estado{font-size:12px;padding-left:14px;border-left:1px solid var(--borde)}
.cab-estado b{font:700 12px var(--cuerpo)}
@media (max-width:1180px){.cab-estado{display:none}}
@media (max-width:980px){.cab{padding:10px 16px}.cab-tit{font-size:19px}}
.pr-bur{font:700 12px var(--cuerpo);border-color:var(--superficie)}
/* Página: el título va arriba, en la cabecera */
.contenido{padding:24px 28px 48px;max-width:none}
@media (max-width:980px){.contenido{padding:20px 16px 40px}}
.pg-tit{margin-bottom:18px;align-items:center}
.pg-tit h1{display:none}
.pg-tit p{margin:0;font-size:13px}
/* Tarjetas y cifras */
.card{padding:22px}
.kpi small,.ciu-card small,.dato small{font:600 11px var(--cuerpo);letter-spacing:.08em}
.h2 small{font-size:12.5px}
/* Pestañas */
.pestanas button{font:600 13.5px var(--cuerpo);letter-spacing:0;background:var(--campo);padding:7px 14px}
.pestanas button:hover{border-color:var(--acento)}
.subpestanas{gap:6px;border-bottom:1px solid var(--borde)}
.subpestanas button{font:600 14px var(--cuerpo);letter-spacing:0;padding:9px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.subpestanas button:hover{color:var(--texto)}
.subpestanas button[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
/* Tablas */
.tabla{border-radius:var(--r-lg);background:var(--superficie)}
table{font-size:13px}
th,td{padding:11px 13px}
th{font:600 11.5px var(--cuerpo);letter-spacing:.3px;color:var(--suave);background:var(--campo)}
tbody tr:hover td{background:var(--campo)}
tfoot td{font:700 14px var(--cuerpo)}
td .sub{font-size:11.5px}
/* Ventanas: blancas con título y ✕, como en el Panel */
.ventana{border:1px solid var(--borde);border-radius:12px}
.ventana-cab{background:var(--superficie);color:var(--texto);padding:20px 24px 12px;border-bottom:1px solid var(--borde)}
.ventana-cab:before{display:none}
.ventana-cab h3{color:var(--texto);font-size:22px}
.ventana-cab p{color:var(--suave)}
.ventana-cuerpo{padding:18px 24px}
.ventana-pie{padding:0 24px 20px}
.cajon-cab h2{font-size:22px}
.velo{background:rgba(0,0,0,.55)}
/* Avisos */
.toast{font:600 14px var(--cuerpo);letter-spacing:0;background:#163832}
.aviso-caja b{font:700 14px var(--cuerpo)}
.menu-tip{font:600 13px var(--cuerpo)}

/* 2.4.77 · Tablas con títulos por bloque (Reporte por semana) */
.tabla table.con-grupos th.grupo{text-align:center;font-family:'Akshar',sans-serif;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--texto);background:var(--campo);border-bottom:1px solid var(--borde)}
.tabla table.con-grupos th.grupo.blo-alt{background:color-mix(in srgb,#8EB69B 28%,var(--superficie))}
.tabla table.con-grupos td.blo-alt,.tabla table.con-grupos th.blo-alt:not(.grupo){background:color-mix(in srgb,#8EB69B 9%,var(--superficie))}
.tabla table.con-grupos .blo-ini{border-left:2px solid var(--borde-control)}
.tabla table.con-grupos tr.fila-total td{font-weight:700;border-top:2px solid #235347;background:color-mix(in srgb,#8EB69B 18%,var(--superficie))}

/* 2.4.80 · Tablero: resumen semanal en bloques */
.tb-semanal .h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-semanal .tb-acc{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-semanal .tb-acc select{min-width:190px}
.tb-bloques{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tb-blo{border:1px solid var(--borde);border-radius:14px;padding:12px 14px;background:var(--superficie)}
.tb-blo:nth-child(even){background:color-mix(in srgb,#8EB69B 9%,var(--superficie))}
.tb-blo h3{font-family:'Akshar',sans-serif;font-size:15px;font-weight:600;margin:0 0 8px;color:var(--texto);padding-bottom:6px;border-bottom:2px solid #235347}
.tb-blo ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tb-blo li{display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:baseline}
.tb-blo li span{font-size:12px;color:var(--suave)}
.tb-blo li b{font-family:'Akshar',sans-serif;font-size:16px;color:var(--texto);text-align:right}
.tb-blo li em{grid-column:1/-1;font-style:normal;font-size:11px;color:var(--suave)}
.tb-blo li.total b{font-size:19px}
.tb-blo li.ok b{color:#235347}
.tb-blo li.mal b{color:#B54708}
:root[data-theme="oscuro"] .tb-blo li.ok b{color:#8EB69B}
:root[data-theme="oscuro"] .tb-blo li.mal b{color:#FDB022}
@media (max-width:1400px){.tb-bloques{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.tb-bloques{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-semanal .tb-acc{margin-left:0;width:100%}}
@media (max-width:560px){.tb-bloques{grid-template-columns:1fr}}
@media print{.menu,.cab,.pg-acc,.herr,.pestanas{display:none!important}.app{display:block}}
</style>
